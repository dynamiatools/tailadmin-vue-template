<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form elements — tailadmin-vue-wc demo</title>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <main class="mx-auto flex max-w-5xl flex-col gap-6 p-8">
      <a href="../index.html" class="text-sm text-brand-600 hover:underline">&larr; All categories</a>
      <h1 class="text-xl font-semibold text-gray-800 dark:text-white">Form elements</h1>
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-checkbox-input&gt;</p>
        <ta-checkbox-input id="demo-ta-checkbox-input"></ta-checkbox-input>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-default-inputs&gt;</p>
        <ta-default-inputs id="demo-ta-default-inputs"></ta-default-inputs>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-dropzone&gt;</p>
        <ta-dropzone id="demo-ta-dropzone"></ta-dropzone>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-file-input&gt;</p>
        <ta-file-input id="demo-ta-file-input"></ta-file-input>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-input-group&gt;</p>
        <ta-input-group id="demo-ta-input-group"></ta-input-group>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-input-state&gt;</p>
        <ta-input-state id="demo-ta-input-state"></ta-input-state>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-multiple-select&gt;</p>
        <div id="demo-ta-multiple-select"></div>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-radio-inputs&gt;</p>
        <ta-radio-inputs id="demo-ta-radio-inputs"></ta-radio-inputs>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-select-input&gt;</p>
        <ta-select-input id="demo-ta-select-input"></ta-select-input>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-text-area&gt;</p>
        <ta-text-area id="demo-ta-text-area"></ta-text-area>
      </div>
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">
        <p class="mb-2 font-mono text-xs text-gray-400">&lt;ta-toggle-switch&gt;</p>
        <ta-toggle-switch id="demo-ta-toggle-switch"></ta-toggle-switch>
      </div>
      </div>
    </main>

    <script type="module" src="../src/pages/forms.ts"></script>
  </body>
</html>
