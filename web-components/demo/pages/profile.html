<!doctype html>
<html lang="en">
  <head>

      <h1 class="text-xl font-semibold text-gray-800 dark:text-white">Profile</h1>
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
      <div class="rounded-lg border border-gray-200 p-4 dark:border-gray-800">

        <ta-profile-card id="demo-ta-profile-card"></ta-profile-card>

        <p class="text-xs text-gray-500 dark:text-gray-400">Not mounted here: same always-open backdrop as ta-modal — see its note above.</p>
